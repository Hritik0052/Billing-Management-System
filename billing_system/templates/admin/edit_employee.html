{% extends 'base.html' %}
{% block title %}Edit Employee{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold text-warning">Edit Employee</h3>
    <a href="{% url 'all_employees' %}" class="btn btn-outline-secondary">
      <i class="fa-solid fa-arrow-left me-1"></i> Back to Employees
    </a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Username</label>
          <input type="text" name="username" class="form-control" value="{{ employee.username }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Email</label>
          <input type="email" name="email" class="form-control" value="{{ employee.email }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">New Password (Optional)</label>
          <input type="password" name="password" class="form-control" placeholder="Leave blank to keep existing password">
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-success">
            <i class="fa-solid fa-floppy-disk me-1"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
