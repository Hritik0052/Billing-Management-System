{% extends 'base.html' %}
{% load static %}

{% block title %}Add Item{% endblock %}

{% block content %}
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold text-primary">Add New Item</h3>
    <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary">
      <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
    </a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body">
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label for="name" class="form-label fw-semibold">Item Name</label>
          <input type="text" name="name" id="name" class="form-control" placeholder="Enter item name" required>
        </div>

        <div class="mb-3">
          <label for="price" class="form-label fw-semibold">Price (₹)</label>
          <input type="number" name="price" id="price" step="0.01" class="form-control" placeholder="Enter price" required>
        </div>

        <div class="mb-3">
          <label for="description" class="form-label fw-semibold">Description</label>
          <textarea name="description" id="description" rows="3" class="form-control" placeholder="Optional description"></textarea>
        </div>

        <div class="text-end">
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-plus me-1"></i> Add Item
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
